{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <h2>Dodaj nowe zadanie</h2>
    <form method="POST" action="{{ url_for('add') }}">
        <div class="mb-3">
            <label for="title" class="form-label">Tytuł</label>
            <input type="text" class="form-control" id="title" name="title" required>
        </div>
        <div class="mb-3">
            <label for="description" class="form-label">Opis</label>
            <textarea class="form-control" id="description" name="description" rows="3"></textarea>
        </div>
        <div class="mb-3">
            <label for="priority" class="form-label">Priorytet</label>
            <select class="form-select" id="priority" name="priority">
                <option value="wysoki">Wysoki</option>
                <option value="średni" selected>Średni</option>
                <option value="niski">Niski</option>
            </select>
        </div>
        <button type="submit" class="btn btn-success">Dodaj zadanie</button>
        <a href="{{ url_for('index') }}" class="btn btn-secondary">Anuluj</a>
    </form>
</div>
{% endblock %}
