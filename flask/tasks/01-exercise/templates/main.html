{% extends "base.html" %}
{% block title %} Strona główna {% endblock %}

{% block content %}
    <h1>Wybierz miasto z listy:</h1>

    <select id="select">
        {% for city in cities %}
            <option value='{{ city }}'>{{ city }}</option>
        {% endfor %}
    </select>

    <a href="/" id="btn">Sprawdź!</button>
{% endblock %}

{% block scripts %}
    <script>
        const sel = document.getElementById('select')
        const btn = document.getElementById('btn')

        sel.oninput = () => {
            btn.href = `/weather/${sel.value}`
        }
    </script>
{% endblock %}
