{% extends 'bootstrap/base.html' %}
{% block title %} {{ title }} {% endblock %}

{% block content %}
    <div class="container mt-4">
        <h2>Dodaj użytkownika</h2>
        <form method="post">
            <div class="form-group">
                <label>Imię</label>
                <input type="text" name="name" class="form-control" placeholder="Wpisz imię" required>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="text" name="email" class="form-control" placeholder="Wpisz email" required>
            </div>

            <button class="btn btn-success btn-sm mt-3">Dodaj</button>
        </form>

        {% if users %}
            <h3 class="mt-3">Lista użytkoników:</h3>

            <ul class="list-group">
                {% for user in users %}
                    <li class="list-group-item">
                        {{ user.name }} - {{ user.email }}
                    </li>
                {% endfor %}
            </ul>
        {% endif %}
    </div>
{% endblock %}
