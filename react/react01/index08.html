<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cw08</title>

    <script crossorigin src="https://unpkg.com/react@17/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@17/umd/react-dom.development.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone@7.10.3/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const imagesData = [
            { id: 1, title: "hyperion", author: "dan simmons", img: "hyperion" },
            { id: 2, title: "spotkanie z ramą", author: "arthur c. clarke", img: "rama" },
            { id: 3, title: "pieśn o rolandzie", img: "roland" },
            { id: 4, title: "silmarillion", author: "john ronald reuel tolkien", img: "silmarillion" },
            { id: 5, title: "furia i inne opowiadania", author: "silvina ocampo", img: "furia" },
            { id: 6, title: "trawa", author: "sheri s. tepper", img: "trawa" },
            { id: 7, title: "bhagawadgita", img: "bhagawadgita" }
        ]

        const ImageList = (props) => {
            return (
                <>
                    {
                        props.data.map((ele, idx) => (
                            <Image data={ ele } key={ idx } />
                        ))
                    }
                </>
            )
        }

        const Image = (props) => {
            console.log(props)

            const capitalize = (text, min_len = 0, fallback = "Nieznany") => {
                if (text == undefined)
                    return fallback

                return text
                        .split(' ')
                        .map(w => {
                            if (w.length > min_len)
                                return w.charAt(0).toUpperCase() + w.slice(1)
                            else
                                return w
                        })
                        .join(' ')
            }
            
            const makeImageTitle = (title) => {
                return capitalize(title, 1)
            }

            const makeImageAuthor = (author) => {
                return capitalize(author)
            }

            const makeImageUrl = (image) => {
                return `/gfx/${image}.png`
            }

            return (
                <>
                    <img src={ makeImageUrl(props.data.img) } alt={ makeImageTitle(props.data.title) } />
                    
                    <h1>{ makeImageTitle(props.data.title) }</h1>
                    <h2>{ makeImageAuthor(props.data.author) }</h2>
                </>
            )
        }
        
        ReactDOM.render(
            <ImageList data={ imagesData } />,
            document.getElementById('root')
        )
    </script>
</body>
</html>
