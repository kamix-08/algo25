<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cw08</title>

    <script crossorigin src="https://unpkg.com/react@17/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@17/umd/react-dom.development.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone@7.10.3/babel.min.js"></script>

    <style>
        .wrap {
            display: flex;
            border: 2px dashed red;
        }

        .title {
            color: red;
        }

        .author {
            color: blue;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const imagesData = [
            { id: 1, title: "hyperion", author: "dan simmons", img: "hyperion" },
            { id: 2, title: "spotkanie z ramą", author: "arthur c. clarke", img: "rama" },
            { id: 3, title: "pieśn o rolandzie", img: "roland" },
            { id: 4, title: "silmarillion", author: "john ronald reuel tolkien", img: "silmarillion" },
            { id: 5, title: "furia i inne opowiadania", author: "silvina ocampo", img: "furia" },
            { id: 6, title: "trawa", author: "sheri s. tepper", img: "trawa" },
            { id: 7, title: "bhagawadgita", img: "bhagawadgita" }
        ]

        // pewnie da się to zrobić lepiej
        // ale jest na to za późno xD
        function uppercaseFirstChar(str) {
            const s = str.split('')
            s[0] = s[0].toUpperCase()
            return s.join('')
        }

        function Image(props) {
            // nie wiem o co chodzi z 
            // "do komponentu Image dodaj funkcje ..."
            // więc po prostu wrzucam je tutaj.
            // poza komponentem też by działało

            function makeImageTitle() {
                // ja to rozumiem tak, że wszystkie słowa
                // dłuższe niż 1 litera mają być z dużej

                return props.title
                    .split(' ')                 // podział na słowa
                    .map(w => w.length > 1  
                        ? uppercaseFirstChar(w) // uppercase dla dłuższych niż 1
                        : w)                    // bez zmian dla pozostałych
                    .join(' ')                  // łączenie z powrotem w stringa
            }

            function makeImageAuthor() {
                // duża litera dla każdej części imo

                if (!props.author)
                    return "Nieznany"

                return props.author
                    .split(' ')
                    .map(w => uppercaseFirstChar(w))
                    .join(' ')
            }

            function makeImageUrl() {
                return `./gfx/${props.img}.jpg`
            }

            return (
                <div className="wrap">
                    <img src={makeImageUrl()}></img>

                    <div className="title">{makeImageTitle()}</div>
                    <div className="author">{makeImageAuthor()}</div>
                </div>
            )
        }

        function ImageList(props) {
            const objects = props.data.map((ele, idx) => (
                <Image key={idx} title={ele.title} author={ele.author} img={ele.img} />
            ))

            return (
                <>
                    {objects}
                </>
            )
        }

        // jak wrzuciłem react18 to render nie działał, więc jest react17
        // nie pamiętam jak to było rozwiązanie u ciebie, ale to raczej szybki fix
        ReactDOM.render(
            <>
                <ImageList data={imagesData} />
            </>,
            document.getElementById('root')
        )
    </script>
</body>
</html>
