        const List = (props) => {
            return (
                <>
                    {
                        props.data.map((ele, idx) => (
                            <Product data={ ele } key={ idx } />
                        ))
                    }
                </>
            )
        }

        const Product = (props) => {
            const formatPrice = (price) => {
                price += ''
                const idx = price.indexOf('.')

                if      (idx == -1)               price += ".00"
                else if (idx == price.length - 2) price += "0"

                return '$' + price
            }

            return (
                <>
                    <p>{ formatPrice(props.data.price) }</p>
                    <h1>{ props.data.title }</h1>
                    <h2>{ props.data.slogan }</h2>
                    <img src={ props.data.product_url } alt={ props.data.title } width="200" />

                    <Stars count={ props.data.stars } img={ props.data.img_url } />
                </>
            )
        }

        const Stars = (props) => {
            return (
                <>
                    {
                        Array(props.count).fill(0).map((_, idx) => (
                            <img src={ props.img } alt="Star" key={ idx } width="50" />
                        ))
                    }
                </>
            )
        }

            document.getElementById('root')
