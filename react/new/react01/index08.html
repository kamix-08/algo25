            { id: 5, title: "furia i inne opowiadania", author: "silvina ocampo", img: "furia" },

            { id: 7, title: "bhagawadgita", img: "bhagawadgita" }
        ]

        const ImageList = () => {
            return (
                <Image title={imagesData[1].title} />
            )
        }

        const Image = (props) => {
            const makeImageTitle = (title) => {
                const arr = Array(...title)
                arr[0] = arr[0].toUpperCase()

                arr.forEach((ele, idx) => {
                    if (ele != " ") return
                    if (arr[idx + 2] == " ") return
                    arr[idx + 1] = arr[idx + 1].toUpperCase(0)
                })

                return arr.join()
            }

            const makeImageAuthor = (author) => {

                arr.forEach((ele, idx) => {
                    if (ele != " ") return

                })

                return arr.join()
            }

            const makeImageUrl = (url) => {
                return `gfx/${url}.png`
            }

            return (<></>)
        }

        ReactDOM.render(
            <ImageList />,
            document.getElementById('react-app')
        )
    </script>
