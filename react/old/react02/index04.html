<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cw04</title>

    <script crossorigin src="https://unpkg.com/react@17.0.2/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@17.0.2/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        function FoodList() {
            const [item, setItem] = React.useState('kurtka')

            let current = item

            const onButtonClick = _ => {
                const items = ['tshirt', 'czapka', 'buty', 'kurtka']

                while(current == item) {
                    current = items[Math.floor(Math.random() * items.length)]
                }

                setItem(current)
            }

            return (
                <>
                    <h1>Parent component</h1>
                    <button onClick={onButtonClick}>wylosuj dla wszystkich</button>

                    <div>
                        <Food food={item} />
                        <Food food={item} />
                        <Food food={item} />
                    </div>
                </>
            )
        }

        function Food(props) {
            // absolutnie nie mam pojęcia o co mu chodzi w treści btw

            const [likes, setLikes] = React.useState(0)

            // zakładając, że 'lubię/nie lubię' ma się 
            // resetować przy odświerzeniu przedmiotów
            React.useEffect(_ => {
                setLikes(0)
            }, [props.food])

            const onButtonClick = _ => {
                if (likes == 0) { setLikes(true) } 
                else            { setLikes(!likes) }
            }

            function returnLike() {
                switch (likes) {
                    case 0:     return "???"
                    case true:  return "lubię"
                    case false: return "nie lubię"
                }
            }

            return (
                <>
                    <h2>child component</h2>
                    <button onClick={onButtonClick}>tak / nie</button>

                    <p>{returnLike()}</p>
                    <p>{props.food}</p>
                </>
            )
        }

        ReactDOM.render(
            <FoodList />,
            document.getElementById('root')
        )
    </script>
</body>

</html>
